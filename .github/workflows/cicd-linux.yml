name: valentina_install_test_linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
    
jobs:

  v4rb_install_test_linux_64:
    name: v4rb_install_test_linux_64
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      - 
        name: Run Script
        run: linux/amd64/v4rb_install_test_linux_amd64.sh ${{ github.event.inputs.version }}

  vpython_install_test_linux_64:
    name: vpython_install_test_linux_64
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      -
        name: Run Script
        run: linux/amd64/vpython_install_test_linux_amd64.sh ${{ github.event.inputs.version }}

  vserver_install_test_linux_64:
    name: vserver_install_test_linux_64
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      - 
        name: Run Script
        run: linux/amd64/vserver_install_test_linux_amd64.sh ${{ github.event.inputs.version }}

  v4rb_install_test_linux_arm64:
    name: v4rb_install_test_linux_arm64
    runs-on: ubuntu-22.04-arm
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Run Script
        run: linux/arm64/v4rb_install_test_linux_arm64.sh ${{ github.event.inputs.version }}

  vserver_install_test_linux_arm64:
      name: vserver_install_test_linux_arm64
      runs-on: ubuntu-22.04-arm
      steps:
        -
          name: Checkout
          uses: actions/checkout@v4
        - 
          name: Run Script
          run: linux/arm64/vserver_install_test_linux_arm64.sh ${{ github.event.inputs.version }}
